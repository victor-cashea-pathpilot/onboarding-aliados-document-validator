name: Real Extraction Evals

on:
  workflow_dispatch:

jobs:
  real-extraction-evals:
    name: Real Extraction Evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GEMINI_LOCATION: ${{ vars.GEMINI_LOCATION || 'global' }}
      GEMINI_MODEL_SIMPLE: ${{ vars.GEMINI_MODEL_SIMPLE || 'gemini-2.5-flash' }}
      GEMINI_MODEL_COMPLEX: ${{ vars.GEMINI_MODEL_COMPLEX || 'gemini-2.5-pro' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_VERTEX_AI_SERVICE_ACCOUNT_KEY }}

      - name: Verify eval cases file exists
        run: test -f eval_cases/ci_cases.json

      - name: Run real extraction evals
        run: |
          python scripts/run_real_extraction_evals.py verify \
            --cases eval_cases/ci_cases.json \
            --baseline eval_cases/ci_baseline.json
