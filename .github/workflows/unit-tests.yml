name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          pytest -vv -rA tests \
            --ignore=tests/test_logic_evals.py \
            --ignore=tests/test_extraction_evals.py \
            --ignore=tests/test_comprehensive_evals.py

  logic-evals:
    name: Logic Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run logic evals
        run: pytest -vv -rA tests/test_logic_evals.py

  extraction-evals:
    name: Extraction Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run extraction evals
        run: pytest -vv -rA tests/test_extraction_evals.py

  comprehensive-evals:
    name: Comprehensive Evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run comprehensive evals
        run: pytest -vv -rA tests/test_comprehensive_evals.py
