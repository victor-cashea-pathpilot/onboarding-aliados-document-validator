name: Backend Tests and Logic Evals

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/unit-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests and logic evals
        run: pytest -q tests
